<!DOCTYPE html>
<html>
<head>
  <title>DWV Test</title>
  <script src="https://unpkg.com/dwv@0.36.4/dist/dwv.min.js"></script>
  <style>
    body { margin: 0; background: black; color: white; }
    #dwv { width: 100vw; height: 100vh; position: relative; }
    .layerContainer { width: 100%; height: 100%; position: absolute; top:0; left:0; }
  </style>
</head>
<body>
  <div id="dwv">
    <div class="layerContainer"></div>
  </div>
  <script>
    console.log("Starting DWV Test...");
    const app = new dwv.App();
    app.init({
      containerDivId: "dwv",
      isMobile: false,
      decoderScripts: {
        "jpeg2000": "/dwv-assets/workers/jpeg2000.worker.min.js",
        "jpeg-lossless": "/dwv-assets/workers/jpegloss.worker.min.js",
        "jpeg-baseline": "/dwv-assets/workers/jpegbaseline.worker.min.js",
        "rle": "/dwv-assets/workers/rle.worker.min.js"
      }
    });

    app.addEventListener('error', (e) => {
      console.error("DWV Error Event:", e);
    });
    
    app.addEventListener('load-start', () => {
      console.log("DWV: Load started...");
    });
    
    app.addEventListener('load-end', () => {
      console.log("DWV: Load ended successfully!");
    });

    setTimeout(() => {
      const url = "http://localhost:3000/standards/00_Normal_1.dcm";
      console.log("Loading URL...", url);
      app.loadURLs([url]);
    }, 1000);
  </script>
</body>
</html>
